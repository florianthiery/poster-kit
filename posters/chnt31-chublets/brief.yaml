  - {url: "https://n4o-rse.github.io/chublets-wikibase-demo/", label: "Browse the chublets"}
  - {url: "https://chublets-wikibase.de", label: "chublets Wikibase"}

numbers:                           # every number on the poster, with its source
  - {value: "416", label: "open-archaeo software entries", source: "sum of data/sparql/categories-result.csv (248 + 94 + 74); SPARQL via rdflib on dist/n4o-rse.github.io-chublets-wikibase-demo.ttl of n4o-rse/chublets-wikibase-demo (commit 90a4e39a, data as of 2026-10-25); README of that repository says the same", queried: "2026-10-31"}
  - {value: "168", label: "properties in the model", source: "docs/data/table-model-statistics.csv of chublets-software/chublets-visuals (commit f408631, 2026-10-25): 10 kernel + 149 initial + 9 review; same figure in the graphic static-vs-federation", queried: "2026-10-31"}

notes: |
  2026-10-31: The Federation Wikibase is NOT a second poster; it belongs on this poster (author's decision).
  Status of chublets-wikibase.de: author chose "prototype runs" (solid) on 2026-10-31, after the PRIMER of wikibase-static
  listed it as filled (980 entries, 7,012 statements, push of 2026-10-25). Not checked live: the sandbox cannot reach it.
  No number from that push is printed on the poster.
  2026-10-31 (round 2): chublets.software EXISTS (author: "da existiert ja"); the "concept" wording and the dashed station are gone.
  The two SPARQL cards were taken off the poster for more graphics (author, round 2); the files stay in data/sparql/.
  The poster formally follows chnt31-fdox (author, 2026-10-31).
  Example chublet: SPARQLing Unicorn QGIS Plugin (Wikidata Q74005133; Q360 in the static demo), asked for by the author.

references:                        # printed in the references block; all taken from the READMEs of the two repositories
  - "Thiery, F. wikibase-static: static, read-only HTML demonstrators for Wikibase instances (version 0.19.0). https://github.com/n4o-rse/wikibase-static"
  - "chublets-wikibase-demo: static demonstration of the planned chublets.software Wikibase data model. https://github.com/n4o-rse/chublets-wikibase-demo"
  - "open-archaeo: https://github.com/n4o-rse/open-archaeo"
  - "find.software: https://find-software.org/"          # added by the author, round 6
  - "Crosswalks of Research Software Metadata Schemas to CodeMeta (ConnOSS), v1.2.0, CC BY 4.0. https://doi.org/10.5281/zenodo.21935688"
