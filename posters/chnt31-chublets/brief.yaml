# brief.yaml: the facts of poster chnt31-chublets, in one place.
# Started in a conversation (see INTERVIEW.md at the repository root), then kept up to date.
# poster.yaml reads these values with {{ brief.<path> }}; content/*.md can do the same.

status: draft                      # interview -> draft -> confirmed (the build warns until it is 'confirmed')

event:
  name: "CHNT31"
  track: "Digital Creative Award"  # same track as chnt31-fdox (author, 2026-10-31)
  place: "TODO city"               # not known yet; chnt31-fdox has the same gap (PRIMER D1)
  dates: "TODO dates"
  url: "https://www.chnt.at/"      # as in chnt31-fdox (author, 2026-10-31)
  format: "A0 portrait"            # confirmed by the author on 2026-10-31; the organiser's rule was not checked
  print_deadline: "not needed"     # author, 2026-10-31: "that does not matter"

poster:
  title: "From open-archaeo to chublets.software:<br>A Wikidata Pipeline for Archaeological Research Software"   # submitted title (author, 2026-11-02), unchanged; <br> only for the line break
  title_plain: "From open-archaeo to chublets.software: A Wikidata Pipeline for Archaeological Research Software"
  short_title: "chublets.software"
  subtitle: "Chublets: from a curated list to a FAIR software marketplace, with Wikibase"   # one line; names what the title does not: chublets, marketplace, Wikibase
  key_message: "Open research software for cultural heritage would become findable, citable and queryable as Linked Data in a chublets Wikibase."   # proposal by Claude, accepted by the author 2026-10-31
  audience: "Cultural heritage and archaeoinformatics community and semantic-web-minded readers, also readers without semantic web background"
  call_to_action: "Browse the chublets; add or improve your own software; talk to us at the poster"
  language: "British English"

authors:                           # order confirmed by the author on 2026-10-31 ("genau so"); affil = number of the affiliation line below
  - {name: "Florian Thiery", affil: "1"}
  - {name: "Ronny Gey", affil: "2"}
  - {name: "Leif Lobinsky", affil: "3"}
  - {name: "Lutz K. Schubert", affil: "4"}

affiliations:                      # one line per author, institutions separated by commas (author's wish, round 2)
  - "Leibniz-Zentrum für Archäologie (LEIZA), Mainz, Germany, Research Squirrel Engineers Network, de-RSE e.V."   # Thiery
  - "find.software, Helmholtz Centre for Environmental Research (UFZ), Leipzig, Germany"                          # Gey
  - "Wikimedia Deutschland, Berlin, Germany"                                                                     # Lobinsky
  - "University of Cologne, Cologne, Germany, CAA e.V."                                                          # Schubert

