  - {name: "Ronny Gey", photo: img/people/ronny-gey.png}
  - {name: "Leif Lobinsky", photo: img/people/leif-lobinsky.png}
  - {name: "Lutz K. Schubert", photo: img/people/lutz-k-schubert.png, focus: [0.5, 0.4]}

