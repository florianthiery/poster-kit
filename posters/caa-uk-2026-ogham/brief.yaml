  title_plain: "Purported, Alleged, Undetermined: Four Degrees of Doubt in the Ogham Corpus"
  short_title: "Four Degrees of Doubt in the Ogham Corpus"
  subtitle: "Four Degrees of Doubt in the Ogham Corpus"
  key_message: "Editors mark doubt precisely in TEI/EpiDoc; a knowledge graph can keep it as weighted, traceable statements, and we show where that still fails."
