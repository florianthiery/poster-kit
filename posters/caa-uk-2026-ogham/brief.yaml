numbers:                           # every number on the poster, with its source
  - {value: "34", label: "records marked doubtful (X series)", source: "OG(H)AM XML, file names ending in -X<nn>, repository lguariento/og-h-am commit 9a68afd (2026-10-29): 13 Irish (I), 12 Welsh (W), 5 English (E), 4 Scottish (S); count by file name, 506 files", queried: "2026-11-01"}
  - {value: "21", label: "of them British", source: "same count: 12 W + 5 E + 4 S", queried: "2026-11-01"}
  - {value: "3", label: "letters restored on Garranes (CIIC 81)", source: "I-COR-030, transliteration edition, three <supplied>; matches tei--epidoc-amt out/README.md", queried: "2026-11-01"}
  - {value: "12 / 9 / 3", label: "unclear / gaps / alternatives on Dyke", source: "S-MOR-001, transliteration edition only (the ogham-script edition repeats them); counted with lxml", queried: "2026-11-01"}
  - {value: "9 / 6", label: "apparatus notes / competing readings on Blackwaterfoot 1", source: "S-BUT-001, <app> and <app>/<rdg>; counted with lxml", queried: "2026-11-01"}

notes: |
  Abstract: "Purported, Alleged, Undetermined: Four Degrees of Doubt in the Ogham Corpus" (CAA UK 2026, Glasgow).
  Four OG(H)AM records form the ladder: CIIC 81 Garranes (I-COR-030), Dyke (S-MOR-001), Blackwaterfoot 1 (S-BUT-001),
  Bishop Loch (S-LKS-X01). Photographs follow once the repositories are extended (PRIMER step P3).
  Bishop Loch: CIIC field empty and CISP field "x" in the edition, which supports "absent from CIIC and CISP" in the abstract.

